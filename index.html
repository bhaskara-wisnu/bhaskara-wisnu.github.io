<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <title>Jam & Kalender Digital Responsif</title>
    <style>
        /* Mengubah ukuran menjadi 100% responsif mengikuti sisa layar browser */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* Struktur wrapper fleksibel tanpa mengunci pixel */
        .wrapper {
            display: table;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .container {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            padding: 10px;
        }

        /* Jam Digital - Disesuaikan agar pas di berbagai kondisi layar */
        #clock {
            color: #ff0000;
            font-size: 180px; 
            font-weight: bold;
            line-height: 0.85;
            margin-bottom: 5px;
            letter-spacing: -6px;
        }

        /* Baris Tanggal */
        #date-line {
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        #date { color: #ffffff; }
        #week { color: #ffff00; margin-left: 20px; }
        #day { color: #00bfff; margin-left: 20px; } 

        /* Tabel Kalender - Ukuran font dimaksimalkan secara aman */
        table {
            border-collapse: collapse;
            font-size: 42px; 
            font-weight: bold;
            margin: 0 auto;
        }

        /* Ukuran sel dibuat fleksibel namun tetap besar */
        th, td {
            width: 90px; 
            height: 62px; 
            text-align: center;
            vertical-align: middle;
            padding: 0;
        }

        th { color: #00bfff; padding-bottom: 5px; } 
        th.day-mi { color: #ff0000; } 
        
        td.week-num { color: #ffff00; } 
        td.sunday { color: #ff0000; } 
        
        /* Lingkaran kuning otomatis menyesuaikan ukuran font baru */
        td.today span {
            display: inline-block;
            width: 62px;
            height: 62px;
            line-height: 54px; /* Mengatur teks pas di tengah lingkaran */
            border: 4px solid #ffff00;
            border-radius: 50%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container">
            
            <div id="clock">--:--</div>
            
            <div id="date-line">
                <span id="date">----.--.--</span>
                <span id="week">W--</span>
                <span id="day">--</span>
            </div>

            <table id="calendar">
                <thead>
                    <tr>
                        <th></th> 
                        <th>Se</th>
                        <th>Sl</th>
                        <th>Ra</th>
                        <th>Ka</th>
                        <th>Ju</th>
                        <th>Sa</th>
                        <th class="day-mi">Mi</th>
                    </tr>
                </thead>
                <tbody id="calendar-body">
                    </tbody>
            </table>

        </div>
    </div>

    <script>
        // JAVASCRIPT ES5 (100% Kompatibel Safari 9 / iPad 2)

        function padZero(num) {
            return num < 10 ? '0' + num : num;
        }

        function getISOWeekNumber(d) {
            var date = new Date(d.getTime());
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
            var week1 = new Date(date.getFullYear(), 0, 4);
            return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        }

        var dayNames = ['Mi', 'Se', 'Sl', 'Ra', 'Ka', 'Ju', 'Sa'];

        function updateClock() {
            var now = new Date();

            var hours = padZero(now.getHours());
            var minutes = padZero(now.getMinutes());
            document.getElementById('clock').innerHTML = hours + ':' + minutes;

            var year = now.getFullYear();
            var month = padZero(now.getMonth() + 1); 
            var date = padZero(now.getDate());
            document.getElementById('date').innerHTML = year + '.' + month + '.' + date;

            var weekNum = getISOWeekNumber(now);
            document.getElementById('week').innerHTML = 'W' + weekNum;

            var dayName = dayNames[now.getDay()];
            document.getElementById('day').innerHTML = dayName;

            setTimeout(updateClock, 1000);
        }

        function generateCalendar() {
            var now = new Date();
            var year = now.getFullYear();
            var month = now.getMonth();
            var todayDate = now.getDate();

            var firstDayOfMonth = new Date(year, month, 1);
            var daysInMonth = new Date(year, month + 1, 0).getDate();

            var startDay = (firstDayOfMonth.getDay() + 6) % 7;

            var tbody = document.getElementById('calendar-body');
            tbody.innerHTML = ''; 

            var dateCounter = 1;
            var rowCount = 0;

            while (dateCounter <= daysInMonth) {
                var tr = document.createElement('tr');

                var sampleDateForRow = new Date(year, month, dateCounter);
                var weekNum = getISOWeekNumber(sampleDateForRow);

                var tdWeek = document.createElement('td');
                tdWeek.className = 'week-num';
                tdWeek.innerHTML = weekNum;
                tr.appendChild(tdWeek);

                for (var i = 0; i < 7; i++) {
                    var td = document.createElement('td');

                    if (rowCount === 0 && i < startDay) {
                        td.innerHTML = '';
                    } else if (dateCounter > daysInMonth) {
                        td.innerHTML = '';
                    } else {
                        if (i === 6) { 
                            td.className = 'sunday';
                        }

                        if (dateCounter === todayDate && month === new Date().getMonth() && year === new Date().getFullYear()) {
                            td.className += (td.className === '' ? '' : ' ') + 'today';
                            td.innerHTML = '<span>' + dateCounter + '</span>';
                        } else {
                            td.innerHTML = dateCounter;
                        }
                        dateCounter++;
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
                rowCount++;
            }
        }

        updateClock();
        generateCalendar();

        // Cek pergantian hari setiap 1 menit untuk memperbarui kalender
        setInterval(function() {
            var now = new Date();
            if (now.getHours() === 0 && now.getMinutes() === 0) {
                generateCalendar();
            }
        }, 60000); 

    </script>
</body>
</html>
