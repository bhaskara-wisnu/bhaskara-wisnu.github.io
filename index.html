<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <title>Jam & Kalender Digital 1024x768 - Max Size</title>
    <style>
        /* Mengunci ukuran layar persis 1024x768 (iPad Lanskap) */
        html, body {
            width: 1024px;
            height: 768px;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden; /* Mencegah layar tergeser/scroll */
        }

        /* Trik 'table' lawas untuk vertikal & horizontal center */
        .wrapper {
            display: table;
            width: 1024px;
            height: 768px;
        }

        .container {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
        }

        /* Jam Digital - Margin bawah dikurangi agar kalender bisa lebih besar */
        #clock {
            color: #ff0000;
            font-size: 230px; 
            font-weight: bold;
            line-height: 0.85;
            margin-bottom: 10px;
            letter-spacing: -8px;
        }

        /* Baris Tanggal - Margin bawah dikurangi */
        #date-line {
            font-size: 65px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        #date { color: #ffffff; }
        #week { color: #ffff00; margin-left: 25px; }
        #day { color: #00bfff; margin-left: 25px; } 

        /* Tabel Kalender - UKURAN FONT DIPERBESAR MAKSIMAL */
        table {
            border-collapse: collapse;
            font-size: 58px; /* Naik signifikan dari sebelumnya */
            font-weight: bold;
            margin: 0 auto;
        }

        /* Ukuran sel disesuaikan untuk mengakomodasi font yang lebih besar */
        th, td {
            width: 115px; 
            height: 75px; 
            text-align: center;
            vertical-align: middle;
            padding: 0;
        }

        th { color: #00bfff; padding-bottom: 5px; } 
        th.day-mi { color: #ff0000; } 
        
        td.week-num { color: #ffff00; } 
        td.sunday { color: #ff0000; } 
        
        /* Lingkaran kuning diperbesar agar pas dengan font 58px */
        td.today span {
            display: inline-block;
            width: 80px;
            height: 80px;
            line-height: 72px; /* Disesuaikan agar teks pas di tengah */
            border: 5px solid #ffff00;
            border-radius: 50%;
            box-sizing: border-box;
        }
    </style>
</head>

        <div class="container
