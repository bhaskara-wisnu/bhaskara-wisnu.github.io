<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, user-scalable=no">
    <title>Jam & Kalender Digital 1024x768 - Max Size</title>
    <style>
        /* Mengunci ukuran layar persis 1024x768 (iPad Lanskap) */
        html, body {
            width: 1024px;
            height: 768px;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden; /* Mencegah layar tergeser/scroll */
        }

        /* Trik 'table' lawas untuk vertikal & horizontal center */
        .wrapper {
            display: table;
            width: 1024px;
            height: 768px;
        }

        .container {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
        }

        /* Jam Digital - Margin bawah dikurangi agar kalender bisa lebih besar */
        #clock {
            color: #ff0000;
            font-size: 230px; 
            font-weight: bold;
            line-height: 0.85;
            margin-bottom: 10px;
            letter-spacing: -8px;
        }

        /* Baris Tanggal - Margin bawah dikurangi */
        #date-line {
            font-size: 65px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        #date { color: #ffffff; }
        #week { color: #ffff00; margin-left: 25px; }
        #day { color: #00bfff; margin-left: 25px; } 

        /* Tabel Kalender - UKURAN FONT DIPERBESAR MAKSIMAL */
        table {
            border-collapse: collapse;
            font-size: 58px; /* Naik signifikan dari sebelumnya */
            font-weight: bold;
            margin: 0 auto;
        }

        /* Ukuran sel disesuaikan untuk mengakomodasi font yang lebih besar */
        th, td {
            width: 115px; 
            height: 75px; 
            text-align: center;
            vertical-align: middle;
            padding: 0;
        }

        th { color: #00bfff; padding-bottom: 5px; } 
        th.day-mi { color: #ff0000; } 
        
        td.week-num { color: #ffff00; } 
        td.sunday { color: #ff0000; } 
        
        /* Lingkaran kuning diperbesar agar pas dengan font 58px */
        td.today span {
            display: inline-block;
            width: 80px;
            height: 80px;
            line-height: 72px; /* Disesuaikan agar teks pas di tengah */
            border: 5px solid #ffff00;
            border-radius: 50%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container">
            
            <div id="clock">--:--</div>
            
            <div id="date-line">
                <span id="date">----.--.--</span>
                <span id="week">W--</span>
                <span id="day">--</span>
            </div>

            <table id="calendar">
                <thead>
                    <tr>
                        <th></th> 
                        <th>Se</th>
                        <th>Sl</th>
                        <th>Ra</th>
                        <th>Ka</th>
                        <th>Ju</th>
                        <th>Sa</th>
                        <th class="day-mi">Mi</th>
                    </tr>
                </thead>
                <tbody id="calendar-body">
                    </tbody>
            </table>

        </div>
    </div>

    <script>
        // JAVASCRIPT ES5 (Kompatibel untuk Safari 9 / iOS 9)

        function padZero(num) {
            return num < 10 ? '0' + num : num;
        }

        function getISOWeekNumber(d) {
            var date = new Date(d.getTime());
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
            var week1 = new Date(date.getFullYear(), 0, 4);
            return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        }

        var dayNames = ['Mi', 'Se', 'Sl', 'Ra', 'Ka', 'Ju', 'Sa'];

        function updateClock() {
            var now = new Date();

            var hours = padZero(now.getHours());
            var minutes = padZero(now.getMinutes());
            document.getElementById('clock').innerHTML = hours + ':' + minutes;

            var year = now.getFullYear();
            var month = padZero(now.getMonth() + 1); 
            var date = padZero(now.getDate());
            document.getElementById('date').innerHTML = year + '.' + month + '.' + date;

            var weekNum = getISOWeekNumber(now);
            document.getElementById('week').innerHTML = 'W' + weekNum;

            var dayName = dayNames[now.getDay()];
            document.getElementById('day').innerHTML = dayName;

            setTimeout(updateClock, 1000);
        }

        function generateCalendar() {
            var now = new Date();
            var year = now.getFullYear();
            var month = now.getMonth();
            var todayDate = now.getDate();

            var firstDayOfMonth = new Date(year, month, 1);
            var daysInMonth = new Date(year, month + 1, 0).getDate();

            var startDay = (firstDayOfMonth.getDay() + 6) % 7;

            var tbody = document.getElementById('calendar-body');
            tbody.innerHTML = ''; 

            var dateCounter = 1;
            var rowCount = 0;

            while (dateCounter <= daysInMonth) {
                var tr = document.createElement('tr');

                var sampleDateForRow = new Date(year, month, dateCounter);
                var weekNum = getISOWeekNumber(sampleDateForRow);

                var tdWeek = document.createElement('td');
                tdWeek.className = 'week-num';
                tdWeek.innerHTML = weekNum;
                tr.appendChild(tdWeek);

                for (var i = 0; i < 7; i++) {
                    var td = document.createElement('td');

                    if (rowCount === 0 && i < startDay) {
                        td.innerHTML = '';
                    } else if (dateCounter > daysInMonth) {
                        td.innerHTML = '';
                    } else {
                        if (i === 6) { 
                            td.className = 'sunday';
                        }

                        if (dateCounter === todayDate && month === new Date().getMonth() && year === new Date().getFullYear()) {
                            td.className += (td.className === '' ? '' : ' ') + 'today';
                            td.innerHTML = '<span>' + dateCounter + '</span>';
                        } else {
                            td.innerHTML = dateCounter;
                        }
                        dateCounter++;
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
                rowCount++;
            }
        }

        updateClock();
        generateCalendar();

        setInterval(function() {
            var now = new Date();
            if (now.getHours() === 0 && now.getMinutes() === 0) {
                generateCalendar();
            }
        }, 60000); 

    </script>
</body>
</html>
