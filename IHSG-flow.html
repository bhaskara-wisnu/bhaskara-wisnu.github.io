            "Sell 7;AMMN;3841;BMRI;4155;BMRI;4154;BBNI;3474;ITMG;22126;NCKL;879;TPIA;1917;TPIA;1730;NCKL;820;MAPI;1510",
            "Sell 6;CUAN;942;BREN;2861;DSSA;482;DSSA;650;MAPI;1489;AADI;7988;AMMN;3568;MAPI;1518;AMRT;1396;MDKA;2624",
            "Sell 5;ANTM;3587;DSSA;698;TPIA;1881;ASII;4746;BBNI;3345;ASII;4825;BREN;3673;AADI;7903;MDKA;2630;UNTR;25136",
            "Sell 4;DSSA;1143;TPIA;2529;AMRT;1180;BBCA;5423;EMAS;6976;BUMI;174;BMRI;4059;BBNI;3180;TLKM;2474;BREN;3275",
            "Sell 3;BBRI;3187;ANTM;3067;BREN;3106;BMRI;4004;BMRI;4018;AMMN;3839;ANTM;2811;BMRI;3899;ASII;4852;BRPT;1659",
            "Sell 2;BBCA;6116;AMMN;3049;BBCA;5831;BBRI;2887;BBCA;5272;TLKM;2757;DSSA;830;BBCA;5810;BMRI;4020;BMRI;4082",
            "Sell 1;BMRI;4247;BBCA;5960;AMMN;3250;TPIA;1540;BBRI;2759;DSSA;831;BBRI;2874;BBRI;2735;MAPI;1520;BBRI;2781"
        ].join('\n');

        var DATES_DAILY = ['06/07', '07/07', '08/07', '09/07', '10/07', '13/07', '14/07', '15/07', '16/07', '17/07'];
        var DATES_WEEKLY = ['Week-20', 'Week-21', 'Week-22', 'Week-23', 'Week-24', 'Week-25', 'Week-26', 'Week-27', 'Week-28', 'Week-29'];

        // ==========================================
        // 2. PALET WARNA BERSAMA
        // ==========================================
        var COLORS = [
            '#f87171', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa',
            '#f472b6', '#2dd4bf', '#fb923c', '#818cf8', '#e879f9',
            '#4ade80', '#38bdf8', '#c084fc', '#facc15', '#94a3b8',
            '#ffed4a', '#ff7675', '#74b9ff', '#55efc4', '#a29bfe',
            '#ff9ff3', '#feca57', '#ff6b6b', '#48dbfb', '#1dd1a1'
        ];

        function getColor(ticker) {
            var hash = 0;
            for (var i = 0; i < ticker.length; i++) {
                hash = ticker.charCodeAt(i) + ((hash << 5) - hash);
            }
            return COLORS[Math.abs(hash) % COLORS.length];
        }

        // ==========================================
        // 3. FUNGSI PARSING & EXTRACT HARGA
        // ==========================================
        function parseData(rawText, datesArray) {
            var seriesMap = {};
            if (!rawText || rawText.trim() === '') return { dates: datesArray, series: [] };
            var lines = rawText.trim().split('\n');

            lines.forEach(function(line) {
                if (line.indexOf('Buy ') === -1 && line.indexOf('Sell ') === -1) return;
                var cols = line.split(';').map(function(c) { return c.trim(); });
                if (cols.length < 3) return;
                
                var typeText = cols[0];
                var matchType = typeText.match(/(Buy|Sell)\s+(\d+)/);
                if (!matchType) return;
                
                var type = matchType[1];
                var rank = parseInt(matchType[2], 10);
                var r = (type === 'Buy') ? rank - 1 : 37 - rank; 

                datesArray.forEach(function(date, dIndex) {
                    var colIdx = 1 + (dIndex * 2); 
                    if (colIdx < cols.length) {
                        var ticker = cols[colIdx];
                        var price = cols[colIdx + 1]; 
                        
                        if (ticker && ticker !== '-' && ticker.length > 0) {
                            if (!seriesMap[ticker]) seriesMap[ticker] = { ticker: ticker, points: [] };
                            seriesMap[ticker].points.push({ d: dIndex, r: r, price: price });
                        }
                    }
                });
            });

            var seriesArray = [];
            for (var key in seriesMap) {
                if (seriesMap.hasOwnProperty(key)) {
                    seriesArray.push(seriesMap[key]);
                }
            }
            seriesArray.forEach(function(series) {
                series.points.sort(function(a, b) { return a.d - b.d; });
            });
            return { dates: datesArray, series: seriesArray };
        }

        // ==========================================
        // 4. FUNGSI RENDER CHART BERSAMA
        // ==========================================
        function buildChart(containerId, titleText, data, svgWidth) {
            svgWidth = svgWidth || 1900;
            var height = 1800;
            var margin = { top: 100, right: 140, bottom: 100, left: 140 };
            var innerWidth = svgWidth - margin.left - margin.right;
            var innerHeight = height - margin.top - margin.bottom;
            
            var totalRanks = 37; 
            var activeTicker = null;
            var numDates = data.dates ? data.dates.length : 0;

            var svgNamespace = "http://www.w3.org/2000/svg";
            var svg = document.createElementNS(svgNamespace, "svg");
            svg.setAttribute("viewBox", "0 0 " + svgWidth + " " + height);
            
            // Background
            var bgRect = document.createElementNS(svgNamespace, "rect");
            bgRect.setAttribute("x", 0);
            bgRect.setAttribute("y", 0);
            bgRect.setAttribute("width", svgWidth);
            bgRect.setAttribute("height", height);
            bgRect.setAttribute("fill", "#111111"); 
            bgRect.classList.add("svg-background");
            bgRect.addEventListener("click", function() {
                if (typeof handleSelect === 'function') handleSelect(null);
            });
            svg.appendChild(bgRect);
            
            // Judul Chart
            var title = document.createElementNS(svgNamespace, "text");
            title.setAttribute("x", svgWidth / 2);
            title.setAttribute("y", 50);
            title.setAttribute("fill", "#fbbf24");
            title.setAttribute("font-size", "28");
            title.setAttribute("font-weight", "bold");
            title.setAttribute("text-anchor", "middle");
            title.style.pointerEvents = "none";
            title.textContent = titleText;
            svg.appendChild(title);

            document.getElementById(containerId).appendChild(svg);

            if (numDates === 0 || !data.series || data.series.length === 0) {
                var emptyMsg = document.createElementNS(svgNamespace, "text");
                emptyMsg.setAttribute("x", svgWidth / 2);
                emptyMsg.setAttribute("y", height / 2);
                emptyMsg.setAttribute("fill", "#555555");
                emptyMsg.setAttribute("font-size", "24");
                emptyMsg.setAttribute("font-weight", "bold");
                emptyMsg.setAttribute("text-anchor", "middle");
                emptyMsg.textContent = "Data tidak tersedia";
                svg.appendChild(emptyMsg);
                return;
            }

            function getX(dateIndex) {
                return numDates > 1 ? (dateIndex / (numDates - 1)) * innerWidth : innerWidth / 2;
            }

            function getY(rankIndex) {
                return (rankIndex / (totalRanks - 1)) * innerHeight;
            }

            var gMain = document.createElementNS(svgNamespace, "g");
            gMain.setAttribute("transform", "translate(" + margin.left + ", " + margin.top + ")");
            svg.appendChild(gMain);

            // GRID & LABELS
            for (var i = 0; i < totalRanks; i++) {
                var line = document.createElementNS(svgNamespace, "line");
                line.setAttribute("x1", 0);
                line.setAttribute("y1", getY(i));
                line.setAttribute("x2", innerWidth);
                line.setAttribute("y2", getY(i));
                line.setAttribute("stroke", "#333");
                line.setAttribute("stroke-width", "0.5");
                line.style.pointerEvents = "none";
                
                if (i === 18) line.setAttribute("stroke-dasharray", "6,6");
                gMain.appendChild(line);

                var labelText = '';
                if (i < 18) {
                    labelText = 'Buy ' + (i + 1);
                } else if (i === 18) {
                    labelText = ''; 
                } else {
                    var reverseIndex = 37 - i; 
                    labelText = 'Sell ' + reverseIndex;
                }

                if (labelText) {
                    var textLeft = document.createElementNS(svgNamespace, "text");
                    textLeft.setAttribute("x", -30);
                    textLeft.setAttribute("y", getY(i));
                    textLeft.setAttribute("fill", "#a1a1aa");
                    textLeft.setAttribute("font-size", "14");
                    textLeft.setAttribute("text-anchor", "end");
                    textLeft.setAttribute("dominant-baseline", "middle");
                    textLeft.style.pointerEvents = "none";
                    textLeft.textContent = labelText;
                    gMain.appendChild(textLeft);

                    var textRight = document.createElementNS(svgNamespace, "text");
                    textRight.setAttribute("x", innerWidth + 30);
                    textRight.setAttribute("y", getY(i));
                    textRight.setAttribute("fill", "#a1a1aa");
                    textRight.setAttribute("font-size", "14");
                    textRight.setAttribute("text-anchor", "start");
                    textRight.setAttribute("dominant-baseline", "middle");
                    textRight.style.pointerEvents = "none";
                    textRight.textContent = labelText;
                    gMain.appendChild(textRight);
                }
            }

            // Garis Neutral Zone
            var neutralLine = document.createElementNS(svgNamespace, "line");
            neutralLine.setAttribute("x1", -100);
            neutralLine.setAttribute("y1", getY(18));
            neutralLine.setAttribute("x2", innerWidth + 100);
            neutralLine.setAttribute("y2", getY(18));
            neutralLine.setAttribute("stroke", "#888");
            neutralLine.setAttribute("stroke-width", "2.5");
            neutralLine.setAttribute("stroke-dasharray", "10,6");
            neutralLine.style.pointerEvents = "none";
            gMain.appendChild(neutralLine);

            var neutralText = document.createElementNS(svgNamespace, "text");
            neutralText.setAttribute("x", innerWidth + 50);
            neutralText.setAttribute("y", getY(18));
            neutralText.setAttribute("fill", "#aaa");
            neutralText.setAttribute("font-size", "16");
            neutralText.setAttribute("font-weight", "bold");
            neutralText.setAttribute("dominant-baseline", "middle");
            neutralText.style.pointerEvents = "none";
            neutralText.textContent = "NEUTRAL ZONE";
            gMain.appendChild(neutralText);

            // Date X Axis
            data.dates.forEach(function(date, i) {
                var textDate = document.createElementNS(svgNamespace, "text");
                textDate.setAttribute("x", getX(i));
                textDate.setAttribute("y", innerHeight + 40);
                textDate.setAttribute("fill", "#ddd");
                textDate.setAttribute("font-size", "16");
                textDate.setAttribute("font-weight", "bold");
                textDate.setAttribute("text-anchor", "middle");
                textDate.style.pointerEvents = "none";
                textDate.textContent = date;
                gMain.appendChild(textDate);
            });

            var elementRefs = {};

            // Layering
            var gLinesLayer = document.createElementNS(svgNamespace, "g");
            gMain.appendChild(gLinesLayer);

            var gPointsLayer = document.createElementNS(svgNamespace, "g");
            gPointsLayer.style.pointerEvents = "none";
            gMain.appendChild(gPointsLayer);

            // Render Data Line & Points
            if (data.series && data.series.length > 0) {
                data.series.forEach(function(series) {
                    var color = getColor(series.ticker);
                    var pathData = series.points.map(function(p, index) {
                        return (index === 0 ? 'M' : 'L') + ' ' + getX(p.d) + ' ' + getY(p.r);
                    }).join(' ');

                    elementRefs[series.ticker] = { lines: [], points: [], texts: [], priceTexts: [] };

                    var gLineGroup = document.createElementNS(svgNamespace, "g");
                    
                    var hitbox = document.createElementNS(svgNamespace, "path");
                    hitbox.setAttribute("d", pathData);
                    hitbox.setAttribute("fill", "none");
                    hitbox.setAttribute("stroke", "transparent");
                    hitbox.setAttribute("stroke-width", "25");
                    hitbox.classList.add("hitbox");
                    gLineGroup.appendChild(hitbox);

                    var visibleLine = document.createElementNS(svgNamespace, "path");
                    visibleLine.setAttribute("d", pathData);
                    visibleLine.setAttribute("fill", "none");
                    visibleLine.setAttribute("stroke", color);
                    visibleLine.setAttribute("stroke-width", "2");
                    visibleLine.setAttribute("opacity", "0.85");
                    visibleLine.classList.add("series-line");
                    gLineGroup.appendChild(visibleLine);
                    elementRefs[series.ticker].lines.push(visibleLine);

                    gLineGroup.addEventListener("click", function(e) {
                        e.stopPropagation(); 
                        if (activeTicker === series.ticker) {
                            handleSelect(null);
                        } else {
                            handleSelect(series.ticker);
                        }
                    });

                    gLinesLayer.appendChild(gLineGroup);

                    var gPointGroup = document.createElementNS(svgNamespace, "g");
                    
                    series.points.forEach(function(p) {
                        var circle = document.createElementNS(svgNamespace, "circle");
                        circle.setAttribute("cx", getX(p.d));
                        circle.setAttribute("cy", getY(p.r));
                        circle.setAttribute("r", "4");
                        circle.setAttribute("fill", color);
                        circle.setAttribute("opacity", "0.85");
                        circle.classList.add("series-point");
                        gPointGroup.appendChild(circle);
                        elementRefs[series.ticker].points.push(circle);

                        var textTicker = document.createElementNS(svgNamespace, "text");
                        textTicker.setAttribute("x", getX(p.d) - 12);
                        textTicker.setAttribute("y", getY(p.r));
                        textTicker.setAttribute("fill", "#e4e4e7");
                        textTicker.setAttribute("font-size", "14");
                        textTicker.setAttribute("text-anchor", "end");
                        textTicker.setAttribute("dominant-baseline", "middle");
                        textTicker.setAttribute("stroke", "#111");
                        textTicker.setAttribute("stroke-width", "4");
                        textTicker.setAttribute("paint-order", "stroke");
                        textTicker.setAttribute("opacity", "0.85");
                        textTicker.classList.add("series-label");
                        textTicker.textContent = series.ticker;
                        gPointGroup.appendChild(textTicker);
                        elementRefs[series.ticker].texts.push(textTicker);

                        // --- FITUR BARU: TEKS HARGA DI ATAS TITIK ---
                        var priceText = document.createElementNS(svgNamespace, "text");
                        priceText.setAttribute("x", getX(p.d));
                        priceText.setAttribute("y", getY(p.r) - 15); // Offset ke atas
                        priceText.setAttribute("fill", "#10b981"); // Warna hijau cerah
                        priceText.setAttribute("font-size", "13");
                        priceText.setAttribute("font-weight", "bold");
                        priceText.setAttribute("text-anchor", "middle");
                        priceText.setAttribute("stroke", "#111"); 
                        priceText.setAttribute("stroke-width", "3");
                        priceText.setAttribute("paint-order", "stroke");
                        priceText.setAttribute("opacity", "0"); // Default tersembunyi
                        priceText.classList.add("series-price");
                        priceText.textContent = p.price; // Set nilai harga
                        gPointGroup.appendChild(priceText);
                        elementRefs[series.ticker].priceTexts.push(priceText);
                    });

                    gPointsLayer.appendChild(gPointGroup);
                });
            }

            function handleSelect(selectedTicker) {
                activeTicker = selectedTicker;

                if (!data.series) return;

                data.series.forEach(function(series) {
                    var isSelected = false;
                    var opacity = "0.85";
                    
                    if (activeTicker !== null) {
                        isSelected = (activeTicker === series.ticker);
                        opacity = isSelected ? "1" : "0.1";
                    }

                    var lineWidth = isSelected ? "6" : "2";
                    var circleRadius = isSelected ? "7" : "4";
                    var textColor = isSelected ? "#ffffff" : "#e4e4e7";
                    var textWeight = isSelected ? "bold" : "normal";

                    var refs = elementRefs[series.ticker];
                    
                    refs.lines.forEach(function(el) {
                        el.setAttribute("opacity", opacity);
                        el.setAttribute("stroke-width", lineWidth);
                        if (isSelected && el.parentNode && el.parentNode.parentNode) {
                            el.parentNode.parentNode.appendChild(el.parentNode);
                        }
                    });

                    refs.points.forEach(function(el) {
                        el.setAttribute("opacity", opacity);
                        el.setAttribute("r", circleRadius);
                    });

                    refs.texts.forEach(function(el) {
                        el.setAttribute("opacity", opacity);
                        el.setAttribute("fill", textColor);
                        el.setAttribute("font-weight", textWeight);
                    });

                    // --- FITUR BARU: MENAMPILKAN HARGA KETIKA DIKLIK ---
                    refs.priceTexts.forEach(function(el) {
                        el.setAttribute("opacity", isSelected ? "1" : "0");
                    });
                    
                    if(isSelected && refs.points.length > 0) {
                         var group = refs.points[0].parentNode;
                         if(group && group.parentNode) {
                             group.parentNode.appendChild(group);
                         }
                    }
                });
            }
        }

        // ==========================================
        // 5. INISIALISASI SEMUA CHART
        // ==========================================
        
        buildChart("retailChartContainer", "Gabungan Daily Retail Flow Rank (Top Buy & Top Sell)", parseData(RETAIL_RAW, DATES_DAILY), 1900);
        buildChart("foreignChartContainer", "Gabungan Foreign Flow Rank (Top Buy & Top Sell)", parseData(FOREIGN_RAW, DATES_DAILY), 1900);
        buildChart("weeklyForeignChartContainer", "Gabungan Weekly Foreign Flow Rank (Top Buy & Top Sell)", parseData(WEEKLY_FOREIGN_RAW, DATES_WEEKLY), 1900);

    </script>
